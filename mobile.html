<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TankUp — Mobile Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--primary:#15803D;--primary-h:#166534;--ink:#0F172A;--second:#475569;--line:#E8EDF3;
    --petrol:#B45309;--cng:#075985;--ev:#5B21B6;--error:#B91C1C}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#0B1220;
    display:flex;justify-content:center;color:var(--ink);overscroll-behavior:none}
  #phone{position:relative;width:100%;max-width:480px;height:100dvh;background:#E9EFE6;overflow:hidden}
  @media(min-width:520px){#phone{height:min(94dvh,1000px);margin:auto;border-radius:36px;box-shadow:0 40px 100px rgba(0,0,0,.6)}}
  /* map */
  #map{position:absolute;inset:0;touch-action:none;cursor:grab}
  #map:active{cursor:grabbing}
  #base{position:absolute;left:0;top:0;will-change:transform}
  #pins{position:absolute;left:0;top:0;width:0;height:0}
  .pin{position:absolute;transform:translate(-50%,-100%);z-index:5}
  .pin .d{width:26px;height:26px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .pin.sel .d{outline:3px solid var(--ink);outline-offset:1px}
  .pin.dim{opacity:.25}
  #meDot{position:absolute;width:20px;height:20px;background:#2563EB;border:4px solid #fff;border-radius:50%;z-index:4;
    box-shadow:0 0 0 10px rgba(37,99,235,.16);transform:translate(-50%,-50%)}
  /* header */
  #hdr{position:absolute;top:0;left:0;right:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;gap:8px}
  #q{flex:1;font-family:inherit;font-size:15px;padding:13px 40px 13px 15px;border:0;border-radius:14px;box-shadow:0 4px 16px rgba(15,23,42,.22);min-width:0}
  #qclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;
    background:#F1F5F9;color:var(--second);font-size:13px;display:none}
  #qclear.on{display:block}
  #q:focus{outline:2px solid var(--primary)}
  #stateChip{font-family:inherit;border:0;border-radius:14px;background:var(--ink);color:#fff;font-size:13px;font-weight:800;
    padding:0 15px;box-shadow:0 4px 16px rgba(15,23,42,.25);white-space:nowrap}
  #avatar{width:48px;height:48px;flex-shrink:0;border-radius:50%;border:3px solid #fff;background:var(--primary);color:#fff;
    font-size:18px;font-weight:800;box-shadow:0 4px 12px rgba(15,23,42,.3)}
  /* map controls */
  #ctl{position:absolute;right:12px;bottom:250px;z-index:15;display:flex;flex-direction:column;gap:8px}
  #ctl button{width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:20px;font-weight:800;color:var(--ink);
    box-shadow:0 3px 10px rgba(15,23,42,.28)}
  /* pin popup card */
  #pop{position:absolute;z-index:25;width:250px;background:#fff;border-radius:16px;padding:13px 14px;display:none;
    box-shadow:0 14px 40px rgba(15,23,42,.35)}
  #pop.on{display:block}
  #pop::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:9px solid transparent}
  #pop.below::after{top:-17px;border-bottom-color:#fff}
  #pop.above::after{bottom:-17px;border-top-color:#fff}
  #pop h4{margin:0;font-size:14.5px;padding-right:22px}
  #pop .m{font-size:12px;color:var(--second);margin-top:3px}
  #pop .p{font-size:17px;font-weight:800;color:var(--primary);margin-top:6px}
  #pop .row{display:flex;gap:7px;margin-top:9px}
  #pop .x{position:absolute;top:6px;right:10px;border:0;background:none;font-size:16px;color:var(--second)}
  .btn{font-family:inherit;flex:1;border-radius:999px;min-height:42px;font-size:13.5px;font-weight:800;border:0;cursor:pointer}
  .btn-p{background:var(--primary);color:#fff}.btn-q{background:#F1F5F9;color:var(--ink)}
  /* bottom sheet */
  #sheet{position:absolute;left:0;right:0;bottom:0;z-index:18;background:#fff;border-radius:22px 22px 0 0;
    box-shadow:0 -10px 34px rgba(15,23,42,.22);display:flex;flex-direction:column;max-height:72%}
  #grab{padding:10px 0 2px;touch-action:none;cursor:grab}
  #grab i{display:block;width:46px;height:5px;border-radius:99px;background:#E2E8F0;margin:0 auto}
  #sheetTitle{font-size:14.5px;font-weight:800;padding:8px 18px 4px}
  #sheetTitle small{color:var(--second);font-weight:600}
  #list{overflow-y:auto;padding:2px 10px calc(14px + env(safe-area-inset-bottom))}
  .row{display:flex;gap:11px;align-items:center;padding:11px 8px;border-radius:13px}
  .row:active{background:#F4F6F9}
  .rd{width:13px;height:13px;border-radius:50% 50% 50% 3px;transform:rotate(-45deg);flex-shrink:0}
  .row .t{font-weight:700;font-size:14px}.row .s{font-size:12px;color:var(--second);margin-top:1px}
  .row .pr{margin-left:auto;font-weight:800;color:var(--primary);font-size:14px;white-space:nowrap;text-align:right}
  .row .pr small{display:block;color:var(--second);font-weight:600;font-size:11px}
  /* overlays */
  .veil{position:absolute;inset:0;z-index:40;background:rgba(11,18,32,.55);display:none;align-items:flex-end}
  .veil.on{display:flex}
  .card{background:#fff;border-radius:24px 24px 0 0;padding:14px 20px calc(22px + env(safe-area-inset-bottom));width:100%;max-height:86%;overflow-y:auto}
  .card h3{margin:6px 0 2px;font-size:20px}.card p{margin:0;color:var(--second);font-size:13.5px}
  .bigbtn{font-family:inherit;width:100%;border-radius:999px;min-height:52px;font-size:16px;font-weight:800;border:0;margin-top:12px;cursor:pointer}
  .ghost{background:#F1F5F9;color:var(--ink)}
  .statelist{display:flex;flex-direction:column;gap:2px;margin-top:10px}
  .statelist button{font-family:inherit;display:flex;justify-content:space-between;align-items:center;border:0;background:none;
    font-size:15px;font-weight:700;color:var(--ink);padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer}
  .statelist button small{color:var(--second);font-weight:600}
  .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-top:1px solid var(--line)}
  .kv span{color:var(--second)}.kv b{text-align:right}
  .tag{font-size:10.5px;font-weight:800;letter-spacing:.05em;border-radius:6px;padding:3px 8px}
  /* nav banner */
  #navb{position:absolute;top:calc(74px + env(safe-area-inset-top));left:12px;right:12px;z-index:22;background:var(--ink);color:#fff;
    border-radius:16px;padding:13px 16px;display:none;box-shadow:0 10px 28px rgba(0,0,0,.4)}
  #navb.on{display:block}
  #navb .eta{font-size:22px;font-weight:800}#navb .rd{font-size:13px;color:#B6C0CE;margin-top:3px}
  #navSteps{margin-top:10px;border-top:1px solid rgba(255,255,255,.14)}
  #navSteps .stp{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.14)}
  #navSteps .stp span{color:#D6DEE8}#navSteps .stp b{color:#fff;white-space:nowrap}
  #navSt{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px}
  #navSt b{color:#fff}#navSt span{color:#B6C0CE}
  #navSt .p{color:#4ADE80;font-weight:800;font-size:15px;margin-top:2px}
  #navBtns{display:flex;gap:8px;margin-top:10px}
  #muteBtn{background:rgba(255,255,255,.14);color:#fff}
  #endBtn{background:var(--error);color:#fff}
  #toast{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13.5px;
    font-weight:600;border-radius:999px;padding:11px 20px;z-index:60;display:none;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .me-pulse{position:absolute;border-radius:50%;background:rgba(37,99,235,.15);transform:translate(-50%,-50%);z-index:3}
</style>
</head>
<body>
<div id="phone">
  <div id="map">
    <svg id="base" width="0" height="0"><g id="world"></g></svg>
    <div id="pins"></div>
    <div id="meDot" style="display:none"></div>
  </div>

  <header id="hdr">
    <div style="position:relative;flex:1;display:flex;max-width:560px">
      <input id="q" placeholder="Search stations, areas…" autocomplete="off">
      <button id="qclear" onclick="clearQ()">✕</button>
    </div>
    <button id="stateChip" onclick="openStates()">Lagos ▾</button>
    <button id="avatar">P</button>
  </header>

  <div id="ctl">
    <button onclick="zoomBy(1.4)">+</button>
    <button onclick="zoomBy(1/1.4)">−</button>
    <button onclick="recenter()">◎</button>
  </div>

  <div id="pop"></div>

  <div id="sheet">
    <div id="grab"><i></i></div>
    <div id="sheetTitle"></div>
    <div id="list"></div>
  </div>

  <div id="navb">
    <div class="eta" id="navEta"></div><div class="rd" id="navRd"></div>
    <div id="navSteps"></div>
    <div id="navSt"></div>
    <div id="navBtns"><button class="btn" id="muteBtn" onclick="toggleMute()">🔊 Voice on</button>
    <button class="btn" id="endBtn" onclick="endNav()">End</button></div></div>

  <div class="veil" id="veil"><div class="card" id="veilCard"></div></div>
  <div id="toast"></div>
</div>

const store=(k,v)=>v===undefined?JSON.parse(localStorage.getItem("tankup."+k)||"null"):localStorage.setItem("tankup."+k,JSON.stringify(v));
const S={state:"Lagos",lga:"All",pos:null,posLabel:"Lagos",sel:null,nav:null,q:"",fuel:"All",mode:"near",voice:true,
 saved:new Set(store("saved")||[])};
const $=id=>document.getElementById(id);
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(t._x);t._x=setTimeout(()=>t.style.display="none",1800);}
function havKm(a,b,c,d){const R=6371,r=x=>x*Math.PI/180;
 const h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function dist(s){if(!S.pos)return null;return havKm(S.pos.lat,S.pos.lng,s.lat,s.lng);}
function dstr(s){const k=dist(s);return k==null?`${s.area}, ${s.state}`:`${k.toFixed(1)} km · ~${Math.max(1,Math.round(k/25*60))} min`;}
function price(s){return "₦"+s.pp.toLocaleString()+s.unit;}

/* ================= MAP ENGINE (drag + pinch like Google Maps) ================= */
const W=220; // world units per degree
const X=lng=>(lng-2.6)*W, Y=lat=>(14-lat)*W;
const V={cx:0,cy:0,z:1}; // centre in world units, scale
const phone=$("phone"), mapEl=$("map"), world=$("world"), base=$("base"), pinsEl=$("pins");
function vw(){return phone.clientWidth;} function vh(){return phone.clientHeight;}
function drawBase(){
  const x0=0,x1=(14.7-2.6)*W,y0=0,y1=(13.9-4.2)*W;
  let s=`<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="#E9EFE6"/>`;
  for(let g=2.6;g<=14.7;g+=0.2)s+=`<line x1="${X(g)}" y1="${y0}" x2="${X(g)}" y2="${y1}" stroke="#DDE5D8" stroke-width="3"/>`;
  for(let g=4.2;g<=13.9;g+=0.2)s+=`<line x1="${x0}" y1="${Y(g)}" x2="${x1}" y2="${Y(g)}" stroke="#DDE5D8" stroke-width="3"/>`;
  for(let g=3;g<=14;g++)s+=`<line x1="${X(g)}" y1="${y0}" x2="${X(g)}" y2="${y1}" stroke="#ffffff" stroke-width="14"/>`;
  for(let g=5;g<=13;g++)s+=`<line x1="${x0}" y1="${Y(g)}" x2="${x1}" y2="${Y(g)}" stroke="#ffffff" stroke-width="14"/>`;
  s+=`<ellipse cx="${X(3.55)}" cy="${Y(6.44)}" rx="70" ry="34" fill="#CFE3EF"/>`; // Lagos lagoon
  s+=`<path d="M ${X(4.5)} ${Y(8.6)} Q ${X(6)} ${Y(8.1)} ${X(7.5)} ${Y(7.6)}" stroke="#CFE3EF" stroke-width="22" fill="none"/>`; // river hint
  s+=`<rect x="${X(3.3)}" y="${Y(6.6)}" width="90" height="60" rx="12" fill="#D9EAD3"/>`;
  s+=`<path id="routePath" d="" stroke="#15803D" stroke-width="14" fill="none" stroke-linecap="round"/>`;
  world.innerHTML=s;
}
function render(){
  const w=vw(),h=vh();
  base.style.width=w+"px";base.style.height=h+"px";
  base.setAttribute("viewBox",`${V.cx-w/2/V.z} ${V.cy-h/2/V.z} ${w/V.z} ${h/V.z}`);
  const items=pool();
  pinsEl.innerHTML=items.map(s=>{const sx=(X(s.lng)-V.cx)*V.z+w/2, sy=(Y(s.lat)-V.cy)*V.z+h/2;
    if(sx<-40||sy<-60||sx>w+40||sy>h+60)return "";
    return `<div class="pin ${S.sel===s.id?"sel":""}" data-id="${s.id}" style="left:${sx}px;top:${sy}px">
      <div class="d" style="background:${FC[s.fuels[0]]}"></div></div>`;}).join("");
  pinsEl.querySelectorAll(".pin").forEach(p=>p.addEventListener("pointerup",e=>{e.stopPropagation();openPop(+p.dataset.id);}));
  if(S.pos){const mx=(X(S.pos.lng)-V.cx)*V.z+w/2,my=(Y(S.pos.lat)-V.cy)*V.z+h/2;
    const me=$("meDot");me.style.display="block";me.style.left=mx+"px";me.style.top=my+"px";}
  if(S.sel)positionPop(true);
}
function pool(){const q=S.q.toLowerCase();return ST.filter(s=>{
  if(S.state!=="All"&&s.state!==S.state)return false;
  if(S.lga&&S.lga!=="All"&&s.lga!==S.lga)return false;
  if(q&&!(s.name+" "+s.addr+" "+s.area+" "+s.lga).toLowerCase().includes(q))return false;
  if(S.fuel!=="All"&&!s.fuels.includes(S.fuel))return false;return true;});}
function fitState(st){
  const rows=ST.filter(s=>st==="All"||s.state===st);
  const xs=rows.map(s=>X(s.lng)),ys=rows.map(s=>Y(s.lat));
  const x0=Math.min(...xs)-60,x1=Math.max(...xs)+60,y0=Math.min(...ys)-60,y1=Math.max(...ys)+60;
  V.cx=(x0+x1)/2;V.cy=(y0+y1)/2;
  V.z=Math.max(0.35,Math.min(vw()/(x1-x0),(vh()*0.62)/(y1-y0)));
  S.sel=null;render();renderSheet();
}
function zoomBy(f,cx,cy){
  const w=vw(),h=vh();cx=cx??w/2;cy=cy??h/2;
  const nz=Math.min(8,Math.max(0.3,V.z*f));
  V.cx+=(cx-w/2)*(1/V.z-1/nz);V.cy+=(cy-h/2)*(1/V.z-1/nz);V.z=nz;render();
}
function recenter(){if(!S.pos){fitState(S.state);toast("No GPS fix — showing "+(S.state==="All"?"Nigeria":S.state));return;}
 V.cx=X(S.pos.lng);V.cy=Y(S.pos.lat);V.z=Math.max(V.z,2.2);S.sel=null;closePop();render();renderSheet();}
/* drag + pinch */
const ptrs=new Map();let pinchD=0;
mapEl.addEventListener("pointerdown",e=>{if(e.target.closest(".pin"))return; // let pin taps through
 mapEl.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2){const p=[...ptrs.values()];pinchD=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}});
mapEl.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;
 const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1){V.cx-=(e.clientX-prev.x)/V.z;V.cy-=(e.clientY-prev.y)/V.z;closePop();render();}
 else if(ptrs.size===2){const p=[...ptrs.values()];
  const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
  if(pinchD)zoomBy(d/pinchD,(p[0].x+p[1].x)/2-mapEl.getBoundingClientRect().left,(p[0].y+p[1].y)/2-mapEl.getBoundingClientRect().top);
  pinchD=d;}});
const dropPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinchD=0;};
mapEl.addEventListener("pointerup",dropPtr);mapEl.addEventListener("pointercancel",dropPtr);
mapEl.addEventListener("wheel",e=>{e.preventDefault();const r=mapEl.getBoundingClientRect();zoomBy(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let lastTap=0;
mapEl.addEventListener("pointerup",e=>{const n=Date.now();if(n-lastTap<300){const r=mapEl.getBoundingClientRect();zoomBy(1.6,e.clientX-r.left,e.clientY-r.top);}lastTap=n;});

/* ================= POPUP CARD (above the pin) ================= */
function openPop(id){
  const s=ST.find(x=>x.id===id);if(!s)return;S.sel=id;render();
  const w=vw(),sx=(X(s.lng)-V.cx)*V.z+w/2,sy=(Y(s.lat)-V.cy)*V.z+vh()/2;
  const below=sy<200, pop=$("pop");
  pop.innerHTML=`<button class="x" onclick="closePop()">✕</button>
   <h4>${s.name}</h4><div class="m">${dstr(s)} · ${s.open?"Open":"Closed"} · ${s.avail}</div>
   <div class="p">${price(s)}</div>
   <div class="row"><button class="btn btn-p" onclick="openDetails(${s.id})">Details</button>
   <button class="btn btn-q" onclick="startNav(${s.id})">Directions</button></div>`;
  pop.className=below?"below":"above";pop.classList.add("on");
  pop.style.visibility="hidden";pop.style.left=Math.min(Math.max(sx-125,8),w-258)+"px";
  const hh=pop.offsetHeight||170;pop.style.visibility="";
  pop.style.top=below?(sy+16)+"px":Math.max(86,sy-hh-30)+"px";
}
function positionPop(fromRender){if(S.sel&&!fromRender)openPop(S.sel);}
function closePop(){S.sel=null;$("pop").classList.remove("on");render();}

/* ================= SHEET / SEARCH / STATES ================= */
const SNAPS=[110,0.42,0.7];let snap=1;
function sheetH(){return snap===0?SNAPS[0]:Math.round(vh()*SNAPS[snap]);}
function renderSheet(){
  const near=S.mode==="near";
  const items=(near?[...pool()]:ST.filter(s=>S.saved.has(s.id)))
   .sort((a,b)=>(S.pos?havKm(S.pos.lat,S.pos.lng,a.lat,a.lng):0)-(S.pos?havKm(S.pos.lat,S.pos.lng,b.lat,b.lng):0));
  $("sheetTitle").innerHTML=`
   <div style="display:flex;gap:8px;margin-bottom:6px">
    <button class="btn ${near?"btn-p":"btn-q"}" style="min-height:38px;font-size:13px" onclick="S.mode='near';renderSheet()">Nearby</button>
    <button class="btn ${near?"btn-q":"btn-p"}" style="min-height:38px;font-size:13px" onclick="S.mode='saved';renderSheet()">♥ Saved (${S.saved.size})</button></div>
   <div>${near?`Near ${S.posLabel}`:"Your saved stations"} <small>· ${items.length}</small></div>`;
  $("sheet").style.height=sheetH()+"px";
  $("list").innerHTML=items.length?items.map(s=>
   `<div class="row" onclick="focusStation(${s.id})">
     <div class="rd" style="background:${FC[s.fuels[0]]}"></div>
     <div><div class="t">${s.name}</div><div class="s">${dstr(s)} · ${s.avail}</div></div>
     <div class="pr">${price(s)}<small>${s.fuels.join(" · ")}</small></div></div>`).join("")
   :(near?`<div style="padding:22px;text-align:center;color:var(--second);font-size:14px">No stations here — try another state or fuel.</div>`
    :`<div style="padding:22px;text-align:center;color:var(--second);font-size:14px">Nothing saved yet — open a station and tap ♡ Save.</div>`);
}
function focusStation(id){
  const s=ST.find(x=>x.id===id);V.cx=X(s.lng);V.cy=Y(s.lat);V.z=Math.max(V.z,2.4);
  openPop(id);renderSheet();
}
$("q").addEventListener("input",e=>{S.q=e.target.value;$("qclear").classList.toggle("on",!!S.q);renderSheet();
 const items=pool();if(S.q&&items.length&&snap===0){snap=1;renderSheet();}});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){const items=pool();if(items.length)focusStation(items[0].id);}});
function clearQ(){S.q="";$("q").value="";$("qclear").classList.remove("on");renderSheet();}
/* sheet drag — robust: capture on grab, suppress tap-after-drag */
(()=>{const g=$("grab");let y0=0,h0=0,moved=false;
 g.addEventListener("pointerdown",e=>{e.preventDefault();y0=e.clientY;h0=sheetH();moved=false;
  try{g.setPointerCapture(e.pointerId);}catch(_){}
  const mv=ev=>{if(Math.abs(ev.clientY-y0)>8)moved=true;
   const h=Math.min(vh()*0.72,Math.max(110,h0+(y0-ev.clientY)));$("sheet").style.height=h+"px";};
  const up=ev=>{const h=h0+(y0-ev.clientY),r=h/vh();
   if(moved){snap=r<0.25?0:r<0.55?1:2;renderSheet();}
   g.removeEventListener("pointermove",mv);g.removeEventListener("pointerup",up);g.removeEventListener("pointercancel",up);};
  g.addEventListener("pointermove",mv);g.addEventListener("pointerup",up);g.addEventListener("pointercancel",up);});
 g.addEventListener("click",()=>{if(moved)return;snap=(snap+1)%3;renderSheet();});})();
/* states */
function openStates(){
  $("veilCard").innerHTML=`<h3>Choose state</h3><p>${STATES.length} states + FCT · ${ST.length} stations</p>
   <input id="stq" placeholder="Type a state…" style="font-family:inherit;width:100%;padding:12px 14px;font-size:15px;border:1.5px solid var(--line);border-radius:12px" oninput="renderStateList(this.value)">
   <div class="statelist" id="stlist"></div>
   <button class="bigbtn ghost" onclick="closeVeil()">Cancel</button>`;
  renderStateList("");
  $("veil").classList.add("on");
  setTimeout(()=>{const i=$("stq");if(i)i.focus();},50);
}
function renderStateList(q){
  q=(q||"").toLowerCase();
  $("stlist").innerHTML=STATES.filter(t=>t.toLowerCase().includes(q)).map(t=>{const n=ST.filter(s=>s.state===t).length;
    return `<button onclick="pickState('${t}')"><span>${t}</span><small>${n} stations${t===S.state?" · ✓":""}</small></button>`;}).join("")
   ||`<div style="padding:16px;text-align:center;color:var(--second)">No state matches.</div>`;
}
function pickState(t){S.state=t;S.lga="All";S.mode="near";S.sel=null;store("homestate",t);closeVeil();
 $("stateChip").textContent=t+" ▾";
 fitState(t);toast("Showing stations in "+t);}
function closeVeil(){$("veil").classList.remove("on");}

/* ================= DETAILS + NAV ================= */
function openDetails(id){
  const s=ST.find(x=>x.id===id);closePop();
  const key=s.fuels.includes("Petrol")?"Petrol":s.fuels[0];
  const rows=ST.filter(x=>x.state===s.state&&x.fuels.includes(key)&&x.open).sort((a,b)=>a.pp-b.pp).slice(0,3);
  const best=rows.length?Math.min(...rows.map(r=>r.pp)):s.pp;
  $("veilCard").innerHTML=`
   <h3>${s.name}</h3><p>${s.addr}, ${s.lga} · ${s.state} · ${dstr(s)}</p>
   <div style="display:flex;gap:6px;margin:10px 0">${s.fuels.map(f=>`<span class="tag" style="background:${FT[f][0]};color:${FT[f][1]}">${f.toUpperCase()}</span>`).join("")}</div>
   <div style="font-size:28px;font-weight:800">${price(s)}</div>
   <div class="kv"><span>Availability</span><b>${s.avail}</b></div>
   <div class="kv"><span>Hours</span><b>${s.hours}</b></div>
   <div class="kv"><span>Rating</span><b>${s.rate} ★ (${s.rc})</b></div>
   <button class="bigbtn" style="background:var(--primary);color:#fff" onclick="startNav(${s.id})">Get Directions</button>
   <button class="bigbtn ghost" onclick="toggleSave(${s.id})">${S.saved.has(id)?"♥ Saved — tap to remove":"♡ Save station"}</button>
   <h3 style="font-size:16px;margin-top:14px">Compare in ${s.state}</h3>
   <table style="width:100%;border-collapse:collapse;font-size:13px">${rows.map(r=>
    `<tr><td style="padding:8px 0;border-top:1px solid var(--line)">${r.name.split("—")[0].trim()}</td>
     <td style="text-align:right;font-weight:800;${r.pp===best?"color:var(--primary)":""}">${price(r)}</td></tr>`).join("")}</table>
   <button class="bigbtn ghost" onclick="closeVeil()">Close</button>`;
  $("veil").classList.add("on");
}
function toggleSave(id){S.saved.has(id)?S.saved.delete(id):S.saved.add(id);
 store("saved",[...S.saved]);renderSheet();toast(S.saved.has(id)?"Saved ♥":"Removed");openDetails(id);}
function toggleMute(){S.voice=!S.voice;
 $("muteBtn").textContent=S.voice?"🔊 Voice on":"🔇 Muted";
 if(S.nav)startNav(S.nav,true);else toast(S.voice?"Voice guidance on":"Voice guidance muted");}
function startNav(id,quiet){
  const s=ST.find(x=>x.id===id);S.nav=id;closeVeil();closePop();
  const ox=S.pos?X(S.pos.lng):V.cx, oy=S.pos?Y(S.pos.lat):V.cy+vh()/2/V.z; // GPS dot, else bottom-centre
  const d=`M ${ox} ${oy} L ${ox} ${Y(s.lat)} L ${X(s.lng)} ${Y(s.lat)}`;
  document.querySelector("#routePath")?.remove();
  world.insertAdjacentHTML("beforeend",`<path id="routePath" d="${d}" stroke="#15803D" stroke-width="16" fill="none" stroke-linecap="round"/>`);
  const k=S.pos?havKm(S.pos.lat,S.pos.lng,s.lat,s.lng):null;
  const mins=k==null?null:Math.max(1,Math.round(k/25*60));
  $("navEta").textContent=k==null?"On your way":`${mins} min · ${k.toFixed(1)} km`;
  $("navRd").textContent=k==null?`To ${s.name}, ${s.area} — enable location for live ETA`
   :`To ${s.name} — ${S.voice?"voice guidance on":"voice muted"}`;
  $("navSteps").innerHTML=`
   <div class="stp"><span>1. Head toward ${s.area}</span><b>${k==null?s.lga:k.toFixed(1)+" km"}</b></div>
   <div class="stp"><span>2. Arrive at ${s.name.split("—")[0].trim()}</span><b>${s.open?"Open":"Closed"}</b></div>`;
  $("navSt").innerHTML=`<b>${s.name}</b> <span>· ${s.fuels.join(" · ")}</span>
   <div class="p">${price(s)} <span>· ${s.avail} · ${s.hours} · ${s.rate} ★</span></div>`;
  $("muteBtn").textContent=S.voice?"🔊 Voice on":"🔇 Muted";
  $("navb").classList.add("on");if(!quiet)toast("Navigating — drive safe 🛣️");
}
function endNav(){S.nav=null;document.querySelector("#routePath")?.remove();$("navb").classList.remove("on");render();}

/* ================= FIRST-RUN: permission → my area ================= */
function nearestState(lng,lat){
  let best="Kano",bk=1e9;for(const s of ST){const k=havKm(lat,lng,s.lat,s.lng);if(k<bk){bk=k;best=s.state;}}return best;
}
function land(pos,label){
  S.pos=pos;S.posLabel=label;S.state=nearestState(pos.lng,pos.lat);S.lga="All";
  $("stateChip").textContent=S.state+" ▾";
  S.sel=null;
  fitState(S.state);
  toast("Showing stations near "+label);
}
function chooseState(){store("onboarded",1);closeVeil();openStates();}
function firstRun(){
  if(store("onboarded")){const h=store("homestate");
    S.state=(h&&h!=="All")?h:"Lagos";S.lga="All";
    $("stateChip").textContent=S.state+" ▾";
    S.pos=null;S.posLabel=S.state;fitState(S.state);renderSheet();return;}
  $("veilCard").innerHTML=`
   <h3>📍 Welcome to TankUp</h3><p>Find fuel near you, anywhere in Nigeria.</p>
   <div class="statelist" style="margin-top:6px">
    <div class="kv"><span>Your stations</span><b>Your area first</b></div>
    <div class="kv"><span>Other states</span><b>One tap away</b></div></div>
   <button class="bigbtn" style="background:var(--primary);color:#fff" onclick="askGeo()">Use my location</button>
   <button class="bigbtn ghost" onclick="chooseState()">Choose your state</button>`;
  $("veil").classList.add("on");
}
function askGeo(){
  closeVeil();toast("Requesting location…");
  if(!navigator.geolocation)return chooseState();
  navigator.geolocation.getCurrentPosition(
    p=>{store("onboarded",1);land({lng:p.coords.longitude,lat:p.coords.latitude},"you");},
    ()=>chooseState(),{timeout:6000});
}
window.addEventListener("resize",render);
drawBase();firstRun();
</script>
</body>
