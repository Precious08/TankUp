<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TankUp — Mobile Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--primary:#15803D;--primary-h:#166534;--ink:#0F172A;--second:#475569;--line:#E8EDF3;
    --petrol:#B45309;--cng:#075985;--ev:#5B21B6;--error:#B91C1C}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#0B1220;
    display:flex;justify-content:center;color:var(--ink);overscroll-behavior:none}
  #phone{position:relative;width:100%;max-width:480px;height:100dvh;background:#E9EFE6;overflow:hidden}
  @media(min-width:520px){#phone{height:min(94dvh,1000px);margin:auto;border-radius:36px;box-shadow:0 40px 100px rgba(0,0,0,.6)}}
  /* map */
  #map{position:absolute;inset:0;touch-action:none;cursor:grab}
  #map:active{cursor:grabbing}
  #base{position:absolute;left:0;top:0;will-change:transform}
  #pins{position:absolute;left:0;top:0;width:0;height:0}
  #clus{position:absolute;left:0;top:0;width:0;height:0;z-index:6}
  .clu{position:absolute;transform:translate(-50%,-50%);min-width:38px;height:38px;border-radius:999px;
    background:var(--ink);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;
    padding:0 10px;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(15,23,42,.9),0 3px 10px rgba(0,0,0,.4)}
  .pin{position:absolute;transform:translate(-50%,-100%);z-index:5}
  .pin .d{width:28px;height:28px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 0 0 1px rgba(15,23,42,.55),0 2px 8px rgba(0,0,0,.4)}
  .pin.sel .d{outline:3px solid var(--ink);outline-offset:1px}
  .pin.dim{opacity:.25}
  #meDot{position:absolute;width:20px;height:20px;background:#2563EB;border:4px solid #fff;border-radius:50%;z-index:4;
    box-shadow:0 0 0 10px rgba(37,99,235,.16);transform:translate(-50%,-50%)}
  /* header */
  #hdr{position:absolute;top:0;left:0;right:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:flex;gap:8px}
  #q{flex:1;font-family:inherit;font-size:15px;padding:13px 40px 13px 15px;border:0;border-radius:14px;box-shadow:0 4px 16px rgba(15,23,42,.22);min-width:0}
  #qclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;border:0;
    background:#F1F5F9;color:var(--second);font-size:13px;display:none}
  #qclear.on{display:block}
  #q:focus{outline:2px solid var(--primary)}
  #stateChip{font-family:inherit;border:0;border-radius:14px;background:var(--ink);color:#fff;font-size:13px;font-weight:800;
    padding:0 15px;box-shadow:0 4px 16px rgba(15,23,42,.25);white-space:nowrap}
  #avatar{width:48px;height:48px;flex-shrink:0;border-radius:50%;border:3px solid #fff;background:var(--primary);color:#fff;
    font-size:18px;font-weight:800;box-shadow:0 4px 12px rgba(15,23,42,.3)}
  /* map controls */
  #ctl{position:absolute;right:12px;bottom:345px;z-index:15;display:flex;flex-direction:column;gap:8px}
  #ctl button{width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:20px;font-weight:800;color:var(--ink);
    box-shadow:0 3px 10px rgba(15,23,42,.28)}
  /* pin popup card */
  #pop{position:absolute;z-index:25;width:250px;background:#fff;border-radius:16px;padding:13px 14px;display:none;
    box-shadow:0 14px 40px rgba(15,23,42,.35)}
  #pop.on{display:block}
  #pop::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:9px solid transparent}
  #pop.below::after{top:-17px;border-bottom-color:#fff}
  #pop.above::after{bottom:-17px;border-top-color:#fff}
  #pop h4{margin:0;font-size:14.5px;padding-right:22px}
  #pop .m{font-size:12px;color:var(--second);margin-top:3px}
  #pop .p{font-size:17px;font-weight:800;color:var(--primary);margin-top:6px}
  #pop .row{display:flex;gap:7px;margin-top:9px}
  #pop .x{position:absolute;top:6px;right:10px;border:0;background:none;font-size:16px;color:var(--second)}
  .btn{font-family:inherit;flex:1;border-radius:999px;min-height:42px;font-size:13.5px;font-weight:800;border:0;cursor:pointer}
  .btn-p{background:var(--primary);color:#fff}.btn-q{background:#F1F5F9;color:var(--ink)}
  /* bottom sheet */
  #sheet{position:absolute;left:0;right:0;bottom:0;z-index:18;background:#fff;border-radius:22px 22px 0 0;
    box-shadow:0 -10px 34px rgba(15,23,42,.22);display:flex;flex-direction:column;max-height:72%}
  #grab{padding:10px 0 2px;touch-action:none;cursor:grab}
  #grab i{display:block;width:46px;height:5px;border-radius:99px;background:#E2E8F0;margin:0 auto}
  #sheetTitle{font-size:14.5px;font-weight:800;padding:8px 18px 4px}
  #sheetTitle small{color:var(--second);font-weight:600}
  #list{overflow-y:auto;padding:2px 10px calc(14px + env(safe-area-inset-bottom))}
  .row{display:flex;gap:11px;align-items:center;padding:11px 8px;border-radius:13px}
  .row>div:nth-child(2){min-width:0;overflow-wrap:anywhere}
  .row:active{background:#F4F6F9}
  .rd{width:13px;height:13px;border-radius:50% 50% 50% 3px;transform:rotate(-45deg);flex-shrink:0}
  .row .t{font-weight:700;font-size:14px}.row .s{font-size:12px;color:var(--second);margin-top:1px}
  .row .pr{margin-left:auto;font-weight:800;color:var(--primary);font-size:14px;white-space:nowrap;text-align:right}
  .row .pr small{display:block;color:var(--second);font-weight:600;font-size:11px}
  /* overlays */
  .veil{position:absolute;inset:0;z-index:40;background:rgba(11,18,32,.55);display:none;align-items:flex-end}
  .veil.on{display:flex}
  .card{background:#fff;border-radius:24px 24px 0 0;padding:14px 20px calc(22px + env(safe-area-inset-bottom));width:100%;max-height:86%;overflow-y:auto}
  .card h3{margin:6px 0 2px;font-size:20px}.card p{margin:0;color:var(--second);font-size:13.5px}
  .bigbtn{font-family:inherit;width:100%;border-radius:999px;min-height:52px;font-size:16px;font-weight:800;border:0;margin-top:12px;cursor:pointer}
  .ghost{background:#F1F5F9;color:var(--ink)}
  .statelist{display:flex;flex-direction:column;gap:2px;margin-top:10px}
  .statelist button{font-family:inherit;display:flex;justify-content:space-between;align-items:center;border:0;background:none;
    font-size:15px;font-weight:700;color:var(--ink);padding:12px 6px;border-bottom:1px solid var(--line);cursor:pointer}
  .statelist button small{color:var(--second);font-weight:600}
  .kv{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-top:1px solid var(--line)}
  .kv span{color:var(--second)}.kv b{text-align:right}
  .tag{font-size:10.5px;font-weight:800;letter-spacing:.05em;border-radius:6px;padding:3px 8px}
  /* nav banner */
  #navb{position:absolute;top:calc(74px + env(safe-area-inset-top));left:12px;right:12px;z-index:22;background:var(--ink);color:#fff;
    border-radius:16px;padding:13px 16px;display:none;box-shadow:0 10px 28px rgba(0,0,0,.4);overflow:hidden}
  #navb.on{display:block}
  #navb .eta{font-size:22px;font-weight:800}#navb .navsub{font-size:13px;color:#B6C0CE;margin-top:3px}
  #navSteps{margin-top:10px;border-top:1px solid rgba(255,255,255,.14)}
  #navSteps .stp{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.14)}
  #navSteps .stp{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.14);align-items:center;overflow:hidden}
  #navSteps .stp span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #navSteps .stp span{color:#D6DEE8}#navSteps .stp b{color:#fff;white-space:nowrap}
  #navSteps .stp.done{opacity:.55}
  #navSteps .stp.done span::before{content:"✓ "}
  #navSteps .stp.cur{background:rgba(74,222,128,.12);border-radius:10px;padding:8px 10px}
  #navArrive{background:rgba(74,222,128,.14);border:1px solid rgba(74,222,128,.4);border-radius:12px;
    padding:12px;font-size:14px;font-weight:700;margin-top:10px}
  #navSt{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px}
  #navSt b{color:#fff}#navSt span{color:#B6C0CE}
  #navSt .p{color:#4ADE80;font-weight:800;font-size:15px;margin-top:2px}
  #navBtns{display:flex;gap:8px;margin-top:10px}
  #muteBtn{background:rgba(255,255,255,.14);color:#fff}
  #endBtn{background:var(--error);color:#fff}
  #toast{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13.5px;
    font-weight:600;border-radius:999px;padding:11px 20px;z-index:60;display:none;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .me-pulse{position:absolute;border-radius:50%;background:rgba(37,99,235,.15);transform:translate(-50%,-50%);z-index:3}
  button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid #4ADE80;outline-offset:2px}
  .pin:focus{outline:none}
  .pin:focus .d{outline:3px solid #4ADE80;outline-offset:2px}
  /* driving mode: nothing on screen except map + nav card */
  #phone.naving #pop{display:none!important}
  #mini{position:absolute;left:12px;right:12px;z-index:16;background:#fff;border-radius:14px;padding:10px 38px 10px 14px;
    box-shadow:0 10px 28px rgba(15,23,42,.3);display:none;cursor:pointer}
  #mini .mx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;
    border:0;background:#F1F5F9;color:var(--second);font-size:13px}
  #phone.naving #mini{display:none!important}
  /* Google-style bottom place card */
  #place{position:absolute;left:0;right:0;bottom:0;z-index:30;background:#fff;border-radius:22px 22px 0 0;
    box-shadow:0 -10px 34px rgba(15,23,42,.25);display:none;flex-direction:column;max-height:74%}
  #place.on{display:flex}
  #pgrab{padding:10px 0 2px;touch-action:none;cursor:grab}
  #pgrab i{display:block;width:46px;height:5px;border-radius:99px;background:#E2E8F0;margin:0 auto}
  #pbody{overflow-y:auto;padding:2px 18px calc(18px + env(safe-area-inset-bottom))}
  #pbody h3{margin:8px 40px 0 0;font-size:20px}
  #place{transition:transform .18s ease}  .pact{display:flex;gap:8px;margin:14px 0 4px}
  .pact .btn{min-height:48px;font-size:14px}
  #phone.naving #sheet{display:none!important}
  #phone.naving #ctl{display:none!important}
  #phone.naving .pin{opacity:.28}
  #phone.naving .pin.dest{opacity:1}
  #phone.naving .pin .pv{display:none!important}
  #phone.naving .pin.dest .d{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px rgba(21,128,61,.45),0 2px 6px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div id="phone">
  <div id="map" role="application" tabindex="0" aria-label="Station map. Arrow keys pan, plus and minus zoom. Tab reaches station pins.">
    <svg id="base" width="0" height="0"><g id="world"></g></svg>
    <div id="pins"></div>
    <div id="clus"></div>
    <div id="meDot" style="display:none"></div>
  </div>

  <header id="hdr">
    <div style="position:relative;flex:1;display:flex;max-width:560px">
      <input id="q" placeholder="Search stations, areas…" autocomplete="off">
      <button id="qclear" onclick="clearQ()">✕</button>
    </div>
    <button id="stateChip" onclick="openStates()">Lagos ▾</button>
    <button id="avatar">P</button>
  </header>

  <div id="ctl">
    <button aria-label="Zoom in" onclick="zoomBy(1.4)">+</button>
    <button aria-label="Zoom out" onclick="zoomBy(1/1.4)">−</button>
    <button aria-label="Back to my area" onclick="recenter()">◎</button>
  </div>

  <div id="pop"></div>
  <div id="mini" onclick="if(S.sel)openDetails(S.sel)"></div>
  <div id="place"><div id="pgrab"><i></i></div><div id="pbody"></div></div>

  <div id="sheet">
    <div id="grab"><i></i></div>
    <div id="sheetTitle"></div>
    <div id="list"></div>
  </div>

  <div id="navb" aria-live="polite" aria-label="Navigation guidance">
    <div style="font-size:10px;font-weight:800;letter-spacing:.12em;color:#7D8AA0">DEMO · SIMULATED MOVEMENT, NOT GPS</div>
    <div class="eta" id="navEta"></div><div class="navsub" id="navRd"></div>
    <div id="navSteps"></div>
    <div id="navSt"></div>
    <div id="navBtns"><button class="btn" id="muteBtn" onclick="toggleMute()">🔊 Voice on</button>
    <button class="btn" id="endBtn" onclick="endNav()">End</button></div></div>

  <div class="veil" id="veil"><div class="card" id="veilCard"></div></div>
  <div id="toast"></div>
</div>
<script src="data/stations.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.local.js"></script>
<script>
/* ================= DATA (sample — verify before launch) ================= */
let ST=TANKUP_STATIONS;
const STATES=[...new Set(ST.map(s=>s.state))].sort();const FC={Petrol:"#B45309",CNG:"#075985",EV:"#5B21B6"};
const FT={Petrol:["#FEF3C7","#B45309"],CNG:["#E0F2FE","#075985"],EV:["#EDE9FE","#5B21B6"]};

/* ================= STATE ================= */
const store=(k,v)=>v===undefined?JSON.parse(localStorage.getItem("tankup."+k)||"null"):localStorage.setItem("tankup."+k,JSON.stringify(v));
const S={state:"Lagos",lga:"All",pos:null,posLabel:"Lagos",sel:null,nav:null,q:"",fuel:"All",mode:"near",voice:true,
 saved:new Set(store("saved")||[])};
const $=id=>document.getElementById(id);
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(t._x);t._x=setTimeout(()=>t.style.display="none",1800);}
function havKm(a,b,c,d){const R=6371,r=x=>x*Math.PI/180;
 const h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function dist(s){if(!S.pos)return null;return havKm(S.pos.lat,S.pos.lng,s.lat,s.lng);}
function dstr(s){const k=dist(s);return k==null?`${s.area}, ${s.state}`:`${k.toFixed(1)} km · ~${Math.max(1,Math.round(k/25*60))} min`;}
function price(s){return "₦"+s.pp.toLocaleString()+s.unit;}

/* ================= MAP ENGINE (drag + pinch like Google Maps) ================= */
const W=220; // world units per degree
const X=lng=>(lng-2.6)*W, Y=lat=>(14-lat)*W;
const V={cx:0,cy:0,z:1}; // centre in world units, scale
const phone=$("phone"), mapEl=$("map"), world=$("world"), base=$("base"), pinsEl=$("pins");
function vw(){return phone.clientWidth;} function vh(){return phone.clientHeight;}
function drawBase(){
  const x0=0,x1=(14.7-2.6)*W,y0=0,y1=(13.9-4.2)*W;
  let s=`<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="#E9EFE6"/>`;
  for(let g=2.6;g<=14.7;g+=0.2)s+=`<line x1="${X(g)}" y1="${y0}" x2="${X(g)}" y2="${y1}" stroke="#DDE5D8" stroke-width="3"/>`;
  for(let g=4.2;g<=13.9;g+=0.2)s+=`<line x1="${x0}" y1="${Y(g)}" x2="${x1}" y2="${Y(g)}" stroke="#DDE5D8" stroke-width="3"/>`;
  for(let g=3;g<=14;g++)s+=`<line x1="${X(g)}" y1="${y0}" x2="${X(g)}" y2="${y1}" stroke="#ffffff" stroke-width="14"/>`;
  for(let g=5;g<=13;g++)s+=`<line x1="${x0}" y1="${Y(g)}" x2="${x1}" y2="${Y(g)}" stroke="#ffffff" stroke-width="14"/>`;
  // Lagos fine streets (the street router below walks this exact grid)
  let f="";
  for(let g=3.30;g<=3.661;g+=0.02){f+=`M ${X(g)} ${Y(6.38)} L ${X(g)} ${Y(6.50)} `;}
  for(let g=6.38;g<=6.501;g+=0.02){f+=`M ${X(3.30)} ${Y(g)} L ${X(3.66)} ${Y(g)} `;}
  s+=`<path d="${f}" stroke="#D9DEE6" stroke-width="7" fill="none"/><path d="${f}" stroke="#ffffff" stroke-width="4" fill="none"/>`;
  s+=`<ellipse cx="${X(3.55)}" cy="${Y(6.44)}" rx="70" ry="34" fill="#CFE3EF"/>`; // Lagos lagoon
  s+=`<path d="M ${X(4.5)} ${Y(8.6)} Q ${X(6)} ${Y(8.1)} ${X(7.5)} ${Y(7.6)}" stroke="#CFE3EF" stroke-width="22" fill="none"/>`; // river hint
  s+=`<rect x="${X(3.3)}" y="${Y(6.6)}" width="90" height="60" rx="12" fill="#D9EAD3"/>`;
  s+=`<path id="routePath" d="" stroke="#15803D" stroke-width="14" fill="none" stroke-linecap="round"/>`;
  world.innerHTML=s;
}
let pinSig="", pinById=new Map();
function render(){
  const w=vw(),h=vh();
  base.style.width=w+"px";base.style.height=h+"px";
  base.setAttribute("viewBox",`${V.cx-w/2/V.z} ${V.cy-h/2/V.z} ${w/V.z} ${h/V.z}`);
  const items=pool();
  const sig=items.map(s=>s.id).join(",")+"|"+S.sel+"|"+S.nav;
  if(sig!==pinSig){ // rebuild DOM only when the set changes; drags just reposition
    pinSig=sig;pinById=new Map();
    pinsEl.innerHTML=items.map(s=>
     `<div class="pin ${S.sel===s.id?"sel":""} ${S.nav===s.id?"dest":""}" data-id="${s.id}" role="button" tabindex="0" aria-label="${s.name}, ${s.fuels.join(", ")}, ${price(s)}, ${s.open?"open":"closed"}">
       <div class="d" style="background:${FC[s.fuels[0]]}"></div></div>`).join("");
    pinsEl.querySelectorAll(".pin").forEach(p=>{pinById.set(+p.dataset.id,p);
      p.addEventListener("pointerup",e=>{e.stopPropagation();openPop(+p.dataset.id);});});
    pinsEl.onkeydown=e=>{const p=e.target.closest&&e.target.closest(".pin");
      if(p&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openPop(+p.dataset.id);}};
  }
  // cluster pins closer than one cell: bubble with count, tap to zoom in
  const CELL=64,grid=new Map();
  for(const s of items){
    const sx=(X(s.lng)-V.cx)*V.z+w/2, sy=(Y(s.lat)-V.cy)*V.z+h/2;
    s._sx=sx;s._sy=sy;
    s._off=(sx<-40||sy<-60||sx>w+40||sy>h+60);
    if(s._off)continue;
    const k=Math.floor(sx/CELL)+":"+Math.floor(sy/CELL);
    if(!grid.has(k))grid.set(k,[]);
    grid.get(k).push(s);}
  const clusEl=$("clus");let ch="";
  for(const s of items){const el=pinById.get(s.id);if(!el)continue;
    el.style.display=s._off?"none":"block";el.style.left=s._sx+"px";el.style.top=s._sy+"px";}
  for(const arr of grid.values()){
    if(arr.length<2||V.z>=5)continue; // split apart when zoomed close
    let cx=0,cy=0;for(const s of arr){cx+=s._sx;cy+=s._sy;
      const el=pinById.get(s.id);if(el&&s.id!==S.sel)el.style.display="none";}
    cx/=arr.length;cy/=arr.length;
    ch+=`<div class="clu" role="button" tabindex="0" aria-label="${arr.length} stations, tap to zoom in" data-x="${cx}" data-y="${cy}">${arr.length}</div>`;}
  clusEl.innerHTML=ch;
  clusEl.querySelectorAll(".clu").forEach(c=>{
    const x=+c.dataset.x,y=+c.dataset.y;
    c.style.left=x+"px";c.style.top=y+"px";
    const go=()=>zoomBy(1.9,x,y);
    c.addEventListener("pointerup",e=>{e.stopPropagation();go();});
    c.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});});
  if(S.pos){const mx=(X(S.pos.lng)-V.cx)*V.z+w/2,my=(Y(S.pos.lat)-V.cy)*V.z+h/2;
    const me=$("meDot");me.style.display="block";me.style.left=mx+"px";me.style.top=my+"px";}
}
function pool(){const q=S.q.toLowerCase();return ST.filter(s=>{
  if(S.state!=="All"&&s.state!==S.state)return false;
  if(S.lga&&S.lga!=="All"&&s.lga!==S.lga)return false;
  if(q&&!(s.name+" "+s.addr+" "+s.area+" "+s.lga).toLowerCase().includes(q))return false;
  if(S.fuel!=="All"&&!s.fuels.includes(S.fuel))return false;return true;});}
function fitState(st){
  const rows=ST.filter(s=>st==="All"||s.state===st);
  const xs=rows.map(s=>X(s.lng)),ys=rows.map(s=>Y(s.lat));

/* ---- street router: A* over the drawn grids, so routes follow roads ---- */
const LAGB={x0:3.30,x1:3.66,y0:6.38,y1:6.50,step:0.02};
const NATB={x0:2.6,x1:14.7,y0:4.2,y1:13.9,step:0.2};
const w2ll=(wx,wy)=>({lng:wx/W+2.6,lat:14-wy/W});
function gridFor(a,b){
  const inL=p=>p.lng>=LAGB.x0&&p.lng<=LAGB.x1&&p.lat>=LAGB.y0&&p.lat<=LAGB.y1;
  return (inL(a)&&inL(b))?LAGB:NATB;
}
function snapN(B,p){
  const ni=Math.round((B.x1-B.x0)/B.step),nj=Math.round((B.y1-B.y0)/B.step);
  const i=Math.min(ni,Math.max(0,Math.round((p.lng-B.x0)/B.step)));
  const j=Math.min(nj,Math.max(0,Math.round((p.lat-B.y0)/B.step)));
  return {i,j,lng:B.x0+i*B.step,lat:B.y0+j*B.step};
}
function astar(B,a,b){
  const key=(i,j)=>i+","+j;
  const H=n=>havKm(B.y0+n.j*B.step,B.x0+n.i*B.step,b.lat,b.lng);
  const open=[{i:a.i,j:a.j,g:0,f:H(a),p:null}];
  const best=new Map([[key(a.i,a.j),0]]);
  const ni=Math.round((B.x1-B.x0)/B.step),nj=Math.round((B.y1-B.y0)/B.step);
  const DD=[[1,0],[-1,0],[0,1],[0,-1]];
  let guard=0;
  while(open.length&&guard++<30000){
    let bi=0;for(let k=1;k<open.length;k++)if(open[k].f<open[bi].f)bi=k;
    const cur=open.splice(bi,1)[0];
    if(cur.i===b.i&&cur.j===b.j){const path=[];let n=cur;
      while(n){path.unshift({lng:B.x0+n.i*B.step,lat:B.y0+n.j*B.step});n=n.p;}return path;}
    for(const dd of DD){
      const i2=cur.i+dd[0],j2=cur.j+dd[1];
      if(i2<0||j2<0||i2>ni||j2>nj)continue;
      const g=cur.g+havKm(B.y0+cur.j*B.step,B.x0+cur.i*B.step,B.y0+j2*B.step,B.x0+i2*B.step);
      const k2=key(i2,j2);
      if(g<(best.has(k2)?best.get(k2):Infinity)){best.set(k2,g);open.push({i:i2,j:j2,g,f:g+H({i:i2,j:j2}),p:cur});}
    }
  }
  return [{lng:a.lng,lat:a.lat},{lng:b.lng,lat:b.lat}]; // fallback: straight
}
function compass(brg){const c=["north","northeast","east","southeast","south","southwest","west","northwest"];return c[Math.round(brg/45)%8];}
function brg(a,b){const r=x=>x*Math.PI/180,d=x=>x*180/Math.PI;
 const y=Math.sin(r(b.lng-a.lng))*Math.cos(r(b.lat));
 const x=Math.cos(r(a.lat))*Math.sin(r(b.lat))-Math.sin(r(a.lat))*Math.cos(r(b.lat))*Math.cos(r(b.lng-a.lng));
 return (d(Math.atan2(y,x))+360)%360;}
function buildSteps(path,s){
  const pts=[path[0]];let b0=null;
  for(let k=1;k<path.length;k++){
    const b=brg(path[k-1],path[k]);
    if(b0===null)b0=b;
    const chg=Math.abs(((b-b0+540)%360)-180);
    if(chg>25){pts.push(path[k-1]);b0=b;}
  }
  pts.push(path[path.length-1]);
  const legs=[];let total=0;
  for(let k=1;k<pts.length;k++){const km=havKm(pts[k-1].lat,pts[k-1].lng,pts[k].lat,pts[k].lng);
    if(km<0.05&&k<pts.length-1)continue;
    legs.push({a:pts[k-1],b:pts[k],km});total+=km;}
  const steps=legs.map((L,i)=>{
    if(i===0)return {t:`Head ${compass(brg(L.a,L.b))}`,d:L.km.toFixed(1)+" km"};
    const pb=brg(legs[i-1].a,legs[i-1].b),turn=((brg(L.a,L.b)-pb+540)%360)-180;
    return {t:turn<-25?"Turn left":turn>25?"Turn right":"Continue straight",d:L.km.toFixed(1)+" km"};});
  if(!steps.length)steps.push({t:"Head to the pin",d:"nearby"});
  steps.push({t:`Arrive at ${s.name.split("—")[0].trim()}`,d:s.open?"Open":"Closed"});
  return {steps,total};
}
function startNav(id,quiet){
  const s=ST.find(x=>x.id===id);S.nav=id;closeVeil();closePop();closeDetails();
  const o=S.pos?{lng:S.pos.lng,lat:S.pos.lat}:w2ll(V.cx,V.cy+(vh()/2)/V.z);
  const B=gridFor(o,s),nodes=astar(B,snapN(B,o),snapN(B,s));
  const path=[o,...nodes.slice(1,-1),{lng:s.lng,lat:s.lat}];
  const d="M "+path.map(p=>`${X(p.lng)} ${Y(p.lat)}`).join(" L ");
  document.querySelector("#routePath")?.remove();document.querySelector("#routeCasing")?.remove();
  world.insertAdjacentHTML("beforeend",`<path id="routeCasing" d="${d}" stroke="#ffffff" stroke-width="17" fill="none" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" opacity=".95"/><path id="routePath" d="${d}" stroke="#16A34A" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`);
  if(!quiet||!S.navSteps){ // fresh navigation builds the step list once
    const built=buildSteps(path,s);
    S.navSteps=built.steps;S.stepIdx=0;S.arrived=false;S.navK=built.total;
  }
  clearInterval(S.navTimer);
  $("phone").classList.add("naving");
  renderNav();render();$("navb").classList.add("on");
  if(!quiet){toast("Navigating — drive safe 🛣️");speak("Navigating. "+S.navSteps[0].t);}
  // hands-free: steps advance on their own like live GPS guidance, no taps needed
  S.navTimer=setInterval(()=>{if(S.stepIdx<S.navSteps.length){advanceStep();}},6000);
}
function renderNav(){
  const s=ST.find(x=>x.id===S.nav);if(!s)return;
  const k=S.navK,n=S.navSteps.length,i=S.stepIdx;
  $("navEta").textContent=S.arrived?"You've arrived":(k==null?"On your way":`${Math.max(1,Math.round(k/25*60))} min · ${k.toFixed(1)} km`);
  $("navRd").textContent=S.arrived?`${s.name}, ${s.area}`:`Step ${Math.min(i+1,n)} of ${n} · to ${s.name.split("—")[0].trim()}`;
  $("navSteps").innerHTML=S.arrived?`<div id="navArrive">🎉 Welcome to ${s.name} — ${price(s)} · ${s.avail}</div>`
   :S.navSteps.map((st,j)=>`<div class="stp ${j<i?"done":""} ${j===i?"cur":""}"><span>${j+1}. ${st.t}</span><b>${j<i?"✓":st.d}</b></div>`).join("");
  $("navSt").innerHTML=`<b>${s.name}</b> <span>· ${s.fuels.join(" · ")}</span>
   <div class="p">${price(s)} <span>· ${s.avail} · ${s.hours} · ${s.rate} ★</span></div>`;
  $("muteBtn").textContent=S.voice?"🔊 Voice on":"🔇 Muted";
}
function advanceStep(){
  if(!S.navSteps)return;
  S.stepIdx++;
  if(S.stepIdx>=S.navSteps.length){S.arrived=true;clearInterval(S.navTimer);
    speak("You have arrived. "+(ST.find(x=>x.id===S.nav)||{}).name);toast("You've arrived 🎉");}
  else speak(S.navSteps[S.stepIdx].t);
  renderNav();
}
function endNav(){S.nav=null;S.navSteps=null;S.stepIdx=0;S.arrived=false;clearInterval(S.navTimer);
 try{speechSynthesis.cancel();}catch(_){}
 document.querySelector("#routePath")?.remove();document.querySelector("#routeCasing")?.remove();
 $("navb").classList.remove("on");
 $("phone").classList.remove("naving");render();renderSheet();}

/* ================= FIRST-RUN: permission → my area ================= */
function nearestState(lng,lat){
  let best="Kano",bk=1e9;for(const s of ST){const k=havKm(lat,lng,s.lat,s.lng);if(k<bk){bk=k;best=s.state;}}return best;
}
function land(pos,label){
  S.pos=pos;S.posLabel=label;S.state=nearestState(pos.lng,pos.lat);S.lga="All";
  $("stateChip").textContent=S.state+" ▾";
  S.sel=null;
  fitState(S.state);
  toast("Showing stations near "+label);
}
function chooseState(){store("onboarded",1);closeVeil();openStates();}
function firstRun(){
  if(store("onboarded")){const h=store("homestate");
    S.state=(h&&h!=="All")?h:"Lagos";S.lga="All";
    $("stateChip").textContent=S.state+" ▾";
    S.pos=null;S.posLabel=S.state;fitState(S.state);renderSheet();return;}
  $("veilCard").innerHTML=`
   <h3>📍 Welcome to TankUp</h3><p>Find fuel near you, anywhere in Nigeria.</p>
   <div class="statelist" style="margin-top:6px">
    <div class="kv"><span>Your stations</span><b>Your area first</b></div>
    <div class="kv"><span>Other states</span><b>One tap away</b></div></div>
   <button class="bigbtn" style="background:var(--primary);color:#fff" onclick="askGeo()">Use my location</button>
   <button class="bigbtn ghost" onclick="chooseState()">Choose your state</button>`;
  $("veil").classList.add("on");
}
function askGeo(){
  closeVeil();toast("Requesting location…");
  if(!navigator.geolocation)return chooseState();
  navigator.geolocation.getCurrentPosition(
    p=>{store("onboarded",1);land({lng:p.coords.longitude,lat:p.coords.latitude},"you");},
    ()=>chooseState(),{timeout:6000});
}
window.addEventListener("resize",render);
/* ---------- live data (Supabase; silent fallback to bundled sample) ---------- */
function dbRow(r,i){
  let lng=0,lat=0;const loc=r.location;
  if(typeof loc==="string"){const m=loc.match(/(-?[\d.]+)\s+(-?[\d.]+)/);if(m){lng=+m[1];lat=+m[2];}}
  else if(loc&&loc.coordinates){lng=+loc.coordinates[0];lat=+loc.coordinates[1];}
  let av="Available";try{const o=typeof r.availability==="string"?JSON.parse(r.availability):(r.availability||{});
    const vs=Object.values(o);if(vs.length){const t=String(vs[0]);av=t.charAt(0).toUpperCase()+t.slice(1);}}catch(e){}
  return {id:i+1,name:r.name,state:r.state||"Lagos",lga:r.lga||"",area:r.area,addr:r.address,lng,lat,
   fuels:r.fuels&&r.fuels.length?r.fuels:["Petrol"],pp:r.petrol_price??r.cng_price??r.ev_price??0,
   unit:r.price_unit||"/L",open:r.is_open!==false,avail:av,hours:r.hours||"Open 24 hrs",
   rate:r.rating??4,rc:r.review_count??0};
}
async function loadLive(){
  try{
    const c=window.TANKUP_CONFIG||{};
    if(!window.supabase||!c.SUPABASE_URL||/xyzcompany|paste-your/.test(c.SUPABASE_URL+(c.SUPABASE_ANON_KEY||"")))return false;
    const cli=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);
    const res=await cli.from("stations").select("*").order("name").limit(500);
    if(res.error||!res.data||!res.data.length)return false;
    return res.data.map(dbRow);
  }catch(e){return false;}
}
drawBase();
(async()=>{const live=await loadLive();
 if(live&&live.length){ST=live;toast("Live data connected ✓");}
 firstRun();})();
</script>
